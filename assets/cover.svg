<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Kiwi Trader</title>
  <desc id="desc">Local-first paper trading research workbench. Research, decide, reconcile, review. Conceptual cover without account or market data.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101d23"/><stop offset="1" stop-color="#153a35"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#b5e8c8" stroke-opacity=".045"/></pattern>
  </defs>
  <rect width="1200" height="380" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="20" fill="url(#grid)"/>
  <circle cx="1100" cy="45" r="190" fill="#a6ec88" fill-opacity=".025"/>
  <circle cx="1100" cy="45" r="135" fill="none" stroke="#a6ec88" stroke-opacity=".08"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif">
    <rect x="56" y="46" width="208" height="30" rx="15" fill="#a6ec88" fill-opacity=".10" stroke="#a6ec88" stroke-opacity=".22"/>
    <circle cx="73" cy="61" r="4" fill="#b5ee96"/>
    <text x="87" y="66" font-size="11" font-weight="600" letter-spacing="1.6" fill="#c7edb4">PROJECT SHOWCASE</text>
    <text x="54" y="151" font-size="64" font-weight="700" letter-spacing="-2" fill="#f4f8f2">Kiwi Trader<tspan fill="#b5ee96">.</tspan></text>
    <text x="58" y="193" font-size="20" fill="#c4d4cc">Local-first. Auditable. Built for research.</text>
    <text x="58" y="231" font-size="15" fill="#93afa4">Paper trading · Explicit contracts · Recoverable workflows</text>
    <path d="M58 264H570" stroke="#628578" stroke-opacity=".4"/>
    <text x="58" y="301" font-size="12" letter-spacing="1.5" fill="#adbfaf">PYTHON / FASTAPI / REACT / SQLITE</text>
    <text x="58" y="338" font-size="11" fill="#90aa9c">Architecture &amp; engineering portfolio — no live account data</text>
    <g transform="translate(758 85)">
      <rect width="358" height="210" rx="16" fill="#0e231f" fill-opacity=".65" stroke="#6a8e77" stroke-opacity=".35"/>
      <text x="24" y="33" font-size="11" letter-spacing="2" fill="#a7c5b4">THE DECISION LOOP</text>
      <path d="M95 90H263V155H95Z" fill="none" stroke="#88b88e" stroke-opacity=".5" stroke-dasharray="4 6"/>
      <g fill="#203d32" stroke="#4e7659"><rect x="23" y="63" width="142" height="52" rx="9"/><rect x="192" y="63" width="142" height="52" rx="9"/><rect x="192" y="131" width="142" height="52" rx="9"/><rect x="23" y="131" width="142" height="52" rx="9"/></g>
      <g font-size="14" fill="#e0eddf" text-anchor="middle"><text x="94" y="94">01 Research</text><text x="263" y="94">02 Decide</text><text x="263" y="162">03 Reconcile</text><text x="94" y="162">04 Review</text></g>
    </g>
  </g>
</svg>
